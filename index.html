<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Speed Test Master</title>
<link rel="manifest" href="manifest.json">
<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js');
  }
</script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&display=swap');

* { margin: 0; padding: 0; box-sizing: border-box; }

body.splash {
  background: radial-gradient(ellipse at center, #1e2330 0%, #0f131c 100%);
  height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  position: relative;
  font-family: 'Outfit', sans-serif;
}

body.splash::before {
  content: '';
  position: absolute;
  width: 400px;
  height: 400px;
  background: radial-gradient(circle, rgba(139, 92, 246, 0.15) 0%, transparent 70%);
  border-radius: 50%;
  animation: pulse 4s ease-in-out infinite;
}

@keyframes pulse {
 0%, 100% { transform: scale(1); opacity: 0.5; }
 50% { transform: scale(1.1); opacity: 0.8; }
}

.gauge-wrap {
  position: relative;
  z-index: 2;
  animation: fadeInUp 1s ease-out;
}

@keyframes fadeInUp {
  from { opacity: 0; transform: translateY(30px); }
  to { opacity: 1; transform: translateY(0); }
}

.gauge {
  width: 220px;
  height: 220px;
  position: relative;
}

.gauge-ring {
  width: 100%;
  height: 100%;
  border-radius: 50%;
  background: conic-gradient(
    from 135deg,
    rgba(255,255,255,0.9) 0deg 60deg,
    rgba(255,255,255,0.3) 60deg 120deg,
    rgba(255,255,255,0.9) 120deg 180deg,
    rgba(255,255,255,0.3) 180deg 240deg,
    rgba(255,255,255,0.9) 240deg 300deg,
    rgba(80,80,90,0.5) 300deg 360deg
  );
  padding: 12px;
  animation: rotate 2s ease-out;
}

@keyframes rotate {
  from { transform: rotate(-90deg); }
  to { transform: rotate(0deg); }
}

.gauge-inner {
  width: 100%;
  height: 100%;
  background: #1a1f2e;
  border-radius: 50%;
  position: relative;
}

.needle {
  position: absolute;
  width: 3px;
  height: 90px;
  background: linear-gradient(to top, #8b5cf6, #fff);
  top: 50%;
  left: 50%;
  transform-origin: bottom center;
  transform: translate(-50%, -100%) rotate(-45deg);
  border-radius: 3px;
  animation: swing 1.5s ease-out 0.5s forwards;
}

@keyframes swing {
 0% { transform: translate(-50%, -100%) rotate(-45deg); }
 60% { transform: translate(-50%, -100%) rotate(35deg); }
 100% { transform: translate(-50%, -100%) rotate(25deg); }
}

.needle-dot {
  position: absolute;
  width: 14px;
  height: 14px;
  background: #8b5cf6;
  border-radius: 50%;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  box-shadow: 0 0 20px rgba(139, 92, 246, 0.8);
}

.logo {
  position: absolute;
  bottom: 80px;
  z-index: 2;
  text-align: center;
  animation: fadeIn 2s ease-out 1s both;
}

@keyframes fadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}

.logo-main {
  font-size: 28px;
  font-weight: 700;
  color: #fff;
  letter-spacing: 3px;
  background: linear-gradient(90deg, #fff, #a78bfa, #fff);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

.logo-sub {
  font-size: 12px;
  color: #6b7280;
  letter-spacing: 4px;
  margin-top: 8px;
}

.dots {
  display: flex;
  gap: 8px;
  margin-top: 40px;
  justify-content: center;
  animation: fadeIn 2s ease-out 1.5s both;
}

.dot {
  width: 6px;
  height: 6px;
  background: #8b5cf6;
  border-radius: 50%;
  animation: bounce 1.4s infinite ease-in-out;
}

.dot:nth-child(2) { animation-delay: 0.2s; }
.dot:nth-child(3) { animation-delay: 0.4s; }

@keyframes bounce {
 0%, 80%, 100% { transform: scale(0.8); opacity: 0.5; }
 40% { transform: scale(1.2); opacity: 1; }
}
</style>
</head>
<body class="splash">

<div class="gauge-wrap">
  <div class="gauge">
    <div class="gauge-ring">
      <div class="gauge-inner">
        <div class="needle"></div>
        <div class="needle-dot"></div>
      </div>
    </div>
  </div>
</div>

<div class="logo">
  <div class="logo-main">SPEED TEST MASTER</div>
  <div class="logo-sub">PRO EDITION</div>
  <div class="dots">
    <div class="dot"></div>
    <div class="dot"></div>
    <div class="dot"></div>
  </div>
</div>

<script>
setTimeout(() => {
  window.location.href = 'dashboard.html';
}, 3000);
</script>

</body>
</html>
